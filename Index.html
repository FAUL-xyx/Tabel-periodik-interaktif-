<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabel Periodik 3D</title>
<style>
:root{box-sizing:border-box;--bg:#12130f;--fg:#e8eadf;--mut:#8b8f7e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:12px}
#bar button{font:inherit;font-size:12px;padding:6px 12px;border:0;border-radius:3px;background:#2a2c24;color:var(--fg);cursor:pointer}
#bar button.on{background:#e8eadf;color:#12130f}
#bar{pointer-events:none;flex-wrap:wrap;align-items:center}
#bar>*{pointer-events:auto}
#bar input{font:inherit;font-size:12px;width:190px;max-width:100%;box-sizing:border-box;padding:6px 10px;border:0;border-radius:3px;background:#2a2c24;color:var(--fg);outline:none}
#bar input:focus{box-shadow:0 0 0 1px var(--mut)}
@media(max-width:560px){#bar input{font-size:16px}}
.el.dim{opacity:.1;pointer-events:none}
#legend{position:fixed;z-index:5;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;padding:0 8px;pointer-events:none}
#legend button{pointer-events:auto;font:inherit;font-size:10px;display:flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid transparent;border-radius:12px;background:#2a2c24;color:var(--fg);cursor:pointer}
#legend button.on{border-color:var(--fg);background:#3a3d32}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#stage{position:absolute;inset:0;perspective:2000px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage:active{cursor:grabbing}
#scene{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.el{position:absolute;left:50%;top:50%;width:84px;height:104px;translate:-50% -50%;box-sizing:border-box;padding:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;cursor:pointer;
  background:hsla(var(--h),60%,38%,.28);border:1px solid hsla(var(--h),70%,60%,.65);border-radius:4px;
  box-shadow:0 0 12px hsla(var(--h),80%,55%,.35);color:hsl(var(--h),85%,78%);
  transition:transform 1.3s cubic-bezier(.2,.8,.2,1),width .3s,height .3s,translate .3s,background .3s,opacity .3s}
.el:hover{background:hsla(var(--h),65%,45%,.5)}
.el i{align-self:flex-end;font-style:normal;font-size:11px;opacity:.8}
.el b{font-size:30px;font-weight:500}
.el u{text-decoration:none;font-size:10px;color:var(--fg);opacity:.8;white-space:nowrap}

.el.x{translate:-50% -50% 40px;z-index:1;background:hsla(var(--h),65%,45%,.6);box-shadow:0 0 22px hsla(var(--h),90%,60%,.9);border-color:hsl(var(--h),90%,70%)}
#info{position:fixed;z-index:6;width:300px;max-width:calc(100vw - 16px);box-sizing:border-box;padding:14px;border-radius:8px;background:hsla(var(--h),40%,12%,.95);border:1px solid hsla(var(--h),70%,60%,.6);box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:12px;line-height:1.5;display:none;overflow:auto;max-height:calc(100vh - 80px);touch-action:pan-y}
#info.on{display:block}
#info h2{margin:0;font-size:22px;font-weight:500;color:hsl(var(--h),85%,78%)}
#info h2 span{font-size:12px;font-weight:400;color:var(--mut);margin-left:8px}
#info h3{margin:12px 0 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:400}
#info p{margin:0}
#info button{position:absolute;top:8px;right:8px;width:26px;height:26px;border:0;border-radius:4px;background:#2a2c24;color:var(--fg);font:inherit;cursor:pointer}
#info .atom{width:170px;height:170px;margin:0 auto}
#info .mol svg{width:100%;height:110px;display:block}
#info .note{color:var(--mut);font-size:11px;margin-top:8px}
.bond{stroke:var(--fg);stroke-width:2;stroke-linecap:round}
.bond.d{stroke-dasharray:3 3;opacity:.7}
.al{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#12130f}


.atom svg{width:100%;height:100%;display:block}
.orb{fill:none;stroke:hsla(var(--h),60%,60%,.45);stroke-width:.8}
.elc{fill:hsl(var(--h),90%,72%)}
.nuc{fill:hsl(var(--h),85%,62%)}
.o{transform-origin:100px 100px;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
</style>
</head>
<body>

<div id="stage"><div id="scene"></div></div>
<div id="info"></div>

}
const bar=document.getElementById("bar");
["table","sphere","helix","grid"].forEach(m=>{const b=document.createElement("button");b.textContent=m;b.dataset.m=m;b.onclick=()=>setMode(m);bar.appendChild(b)});
function frame(){
  if(!drag&&(mode=="sphere"||mode=="helix")&&!scene.querySelector(".x"))try_+=.15;
  rx+=(trx-rx)*.1;ry+=(try_-ry)*.1;k+=(tk-k)*.1;
  scene.style.transform=`scale(${k}) rotateX(${rx}deg) rotateY(${ry}deg)`;if(sel)placeInfo();
  requestAnimationFrame(frame);
}
// interaksi: seret putar, scroll/cubit zoom, klik = detail
const ptr=new Map();let moved=0,pd=0,startT=null;
stage.addEventListener("pointerdown",e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);drag=true;if(ptr.size==1){moved=0;startT=e.target.closest(".el")}
  if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
addEventListener("pointermove",e=>{
  if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
  if(ptr.size==1){const dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);
    try_+=dx*.4;trx=Math.max(-80,Math.min(80,trx-dy*.4));ry=try_;rx=trx}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);tk=Math.max(.1,Math.min(3,tk*d/pd));pd=d;moved=99}
});
function up(e){
  if(ptr.size==1&&moved<6&&startT){const was=startT.classList.contains("x");
    closeEl();if(!was)openEl(startT)}
  ptr.delete(e.pointerId);if(!ptr.size)drag=false;
}
addEventListener("pointerup",up);addEventListener("pointercancel",up);
stage.addEventListener("wheel",e=>{e.preventDefault();tk=Math.max(.1,Math.min(3,tk*Math.exp(-e.deltaY*.001)))},{passive:false});
addEventListener("resize",()=>{tk=fit(mode)});
// legenda kategori (klik = sorot) + pencarian
let fCat=null,q="";
function applyFilter(){const t=q.toLowerCase(),m=[];
  els.forEach((o,i)=>{const n=i+1,I=INFO[n],nm=I.nm.toLowerCase();let ok=!fCat||I.c[0]==fCat;
    if(ok&&t)ok=I.sy.toLowerCase()==t||String(n)==t||(t.length>1?nm.includes(t):nm.startsWith(t))||(t.length>2&&I.c[0].toLowerCase().includes(t));
    o.e.classList.toggle("dim",!ok);if(ok)m.push(n)});
  return m}
// putar bola/helix supaya unsur yang dicari menghadap ke depan
function faceTo(i){if(mode!="sphere"&&mode!="helix")return;const th=mode=="sphere"?Math.sqrt(N*Math.PI)*Math.acos(-1+2*i/N):i*.175+Math.PI,a=-th*180/Math.PI;try_=a+Math.round((ry-a)/360)*360;trx=0}
function show(n){const e=els[n-1].e;if(sel===e)return;faceTo(n-1);openEl(e)}
const lg=document.createElement("div");lg.id="legend";document.body.appendChild(lg);
Object.values(CAT).forEach(([lb,h])=>{const b=document.createElement("button"),c=INFO.filter(x=>x&&x.c[0]==lb).length;
  b.innerHTML=`<i style="background:hsl(${h},70%,55%)"></i>${lb} (${c})`;
  b.onclick=()=>{fCat=fCat==lb?null:lb;lg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b&&!!fCat));applyFilter()};lg.appendChild(b)});
const inp=document.createElement("input");inp.type="search";inp.placeholder="Cari nama / simbol / nomor";inp.autocomplete="off";bar.appendChild(inp);
inp.oninput=()=>{q=inp.value.trim();const m=applyFilter();if(q&&m.length==1)show(m[0])};
inp.onkeydown=e=>{if(e.key=="Enter"){const m=applyFilter();if(m.length)show(m[0]);inp.blur()}else if(e.key=="Escape"){inp.value="";q="";applyFilter();closeEl()}};
setMode("table");k=tk;requestAnimationFrame(frame);
</script>
</body>
</html>
